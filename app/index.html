<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crivo · Inteligência Fiscal de Fornecedores</title>
    <meta name="description" content="O Crivo avalia a conformidade tributária de fornecedores (CBS/IBS · LC 214/2025) e gera um score de aderência fiscal com alertas automáticos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700;900&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#C8963A",
              navy: "#0A1420",
              gold: "#C8963A",
              success: "#3DB882",
              warning: "#E0913A",
              danger: "#E05252",
            },
            fontFamily: { sans: ["IBM Plex Sans", "sans-serif"], serif: ["Playfair Display", "serif"], mono: ["IBM Plex Mono", "monospace"] },
          },
        },
      };
    </script>
    <style>
      :root{
        --ink:#0A1420;--ink2:#12202F;--ink3:#1A2D42;
        --gold:#C8963A;--gold2:#E8B050;--gold3:#F5D080;
        --gold-bg:rgba(200,150,58,.08);--gold-bg2:rgba(200,150,58,.15);
        --gold-bd:rgba(200,150,58,.25);--gold-bd2:rgba(200,150,58,.5);
        --cream:#F4F0E8;--muted:#6B7A8D;--muted2:#8A96A8;
        --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
        --card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);
      }
      *{letter-spacing:0}
      body { background:var(--ink); color:var(--cream); font-family:"IBM Plex Sans",sans-serif; }
      .glass { background: rgba(10,20,32,.9)!important; backdrop-filter: blur(20px); }
      .scorebar > span { transition: width .8s ease; }
      .bg-white,.bg-slate-100,.bg-slate-50{background:var(--card)!important}
      .bg-navy{background:var(--ink)!important}
      .text-navy,.text-slate-900,.text-slate-800,.text-slate-700{color:var(--cream)!important}
      .text-slate-600,.text-slate-500,.text-slate-400,.text-slate-300{color:var(--muted2)!important}
      .border,.border-slate-200,.border-slate-300{border-color:var(--bd2)!important}
      .shadow-sm,.shadow-lg{box-shadow:none!important}
      .rounded-xl{border-radius:10px}
      input,select,textarea{background:rgba(255,255,255,.05)!important;color:var(--cream)!important;border-color:var(--bd2)!important}
      input::placeholder,textarea::placeholder{color:var(--muted)!important}
      option{background:var(--ink2);color:var(--cream)}
      .bg-brand,.bg-gold{background:var(--gold)!important;color:var(--ink)!important}
      .hover\:bg-blue-700:hover,.hover\:bg-yellow-500:hover{background:var(--gold2)!important;color:var(--ink)!important}
      .ring-brand\/20{--tw-ring-color:rgba(200,150,58,.25)!important}
      .border-brand{border-color:var(--gold-bd2)!important}
      .font-serif{letter-spacing:-.02em}
      header{border-color:var(--bd)!important}
      a:hover{color:var(--gold2)}
      button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
      html{scroll-behavior:smooth}
      ::selection{background:rgba(200,150,58,.35)}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:var(--ink)}
      ::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:8px}
      ::-webkit-scrollbar-thumb:hover{background:var(--gold-bd2)}
      button,a{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .15s ease,opacity .2s ease,box-shadow .2s ease}
      button:active{transform:scale(.97)}
      input,select,textarea{transition:border-color .2s ease,box-shadow .2s ease}
      input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(200,150,58,.16);border-color:var(--gold-bd2)!important;outline:none}
      .glass{box-shadow:0 10px 30px -24px rgba(0,0,0,.9)}
      .hero-bg{background:radial-gradient(900px 420px at 82% -10%,rgba(200,150,58,.14),transparent 60%),radial-gradient(640px 320px at 8% 112%,rgba(46,134,193,.10),transparent 60%)}
      .card-lift{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
      .card-lift:hover{transform:translateY(-3px);border-color:var(--gold-bd2)!important;box-shadow:0 14px 34px -20px rgba(200,150,58,.4)!important}
      @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      .fade-in{animation:fadeIn .25s ease}
      @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
      .page-enter{animation:fadeUp .35s ease both}
      @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
      .modal-in{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
      @keyframes toastIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
      .toast-in{animation:toastIn .3s ease both}
      .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
      .reveal.on{opacity:1;transform:none}
      @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(200,150,58,.55)}70%{box-shadow:0 0 0 7px rgba(200,150,58,0)}}
      .dot-pulse{animation:pulseDot 2.2s infinite}
      @keyframes skeleton{0%{background-position:-220px 0}100%{background-position:220px 0}}
      .skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.13) 37%,rgba(255,255,255,.05) 63%);background-size:440px 100%;animation:skeleton 1.3s linear infinite;border-radius:8px}
      @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { createContext, useContext, useEffect, useMemo, useState } from "https://esm.sh/react@18.2.0";
      import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

      const SUPABASE_URL = "https://lgbuywbcpnghqaoaqsxb.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYnV5d2JjcG5naHFhb2Fxc3hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDM1OTQsImV4cCI6MjA5NjUxOTU5NH0.o4ksmO3u75axuX8-9ena7OC_CgkCC_y9AzPBA60776Q";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

      const h = React.createElement;
      const childList = (children) => Array.isArray(children) ? children : [children].filter((x) => x !== undefined && x !== null && x !== false);
      const AuthContext = createContext(null);
      const money = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const PENDING_KEY = "crivo_pending_setup";

      // ---------- Helpers ----------
      function cleanCnpj(v) { return String(v || "").replace(/\D/g, ""); }
      function formatCnpj(v) {
        const d = cleanCnpj(v).slice(0, 14);
        return d.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
      }
      function validCnpj(value) {
        const c = cleanCnpj(value);
        if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
        const calc = (base, weights) => {
          const n = base.split("").reduce((a, v, i) => a + Number(v) * weights[i], 0);
          const x = n % 11;
          return x < 2 ? 0 : 11 - x;
        };
        const d1 = calc(c.slice(0, 12), [5,4,3,2,9,8,7,6,5,4,3,2]);
        const d2 = calc(c.slice(0, 12) + d1, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
        return d1 === Number(c[12]) && d2 === Number(c[13]);
      }
      function risk(score) {
        const n = Number(score || 0);
        if (n >= 800) return { label: "Baixo risco", color: "bg-success", text: "text-success", soft: "bg-green-50" };
        if (n >= 600) return { label: "Médio risco", color: "bg-warning", text: "text-warning", soft: "bg-amber-50" };
        return { label: "Alto risco", color: "bg-danger", text: "text-danger", soft: "bg-red-50" };
      }
      function translateError(message) {
        const m = String(message || "");
        if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
        if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada.";
        if (/already registered|already been registered/i.test(m)) return "Este e-mail já possui conta. Faça login.";
        if (/Password should be at least/i.test(m)) return "A senha precisa ter no mínimo 8 caracteres.";
        if (/rate limit|too many/i.test(m)) return "Muitas tentativas. Aguarde um instante e tente novamente.";
        if (/duplicate key/i.test(m)) return "Este registro já existe.";
        if (/Failed to fetch|NetworkError|fetch failed/i.test(m)) return "Falha de conexão. Verifique sua internet e tente novamente.";
        return m || "Algo deu errado. Tente novamente.";
      }
      function timeAgo(iso) {
        const s = (Date.now() - Date.parse(iso)) / 1000;
        if (!isFinite(s)) return "";
        if (s < 60) return "agora";
        if (s < 3600) return `há ${Math.floor(s / 60)} min`;
        if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
        return `há ${Math.floor(s / 86400)} d`;
      }
      function toast(message, type = "ok") {
        window.dispatchEvent(new CustomEvent("toast", { detail: { message, type } }));
      }
      async function lookupCnpj(cnpj) {
        const d = cleanCnpj(cnpj);
        if (d.length !== 14) throw new Error("CNPJ incompleto");
        const res = await fetch(`https://publica.cnpj.ws/cnpj/${d}`);
        if (res.status === 429) throw new Error("Limite de consultas à Receita atingido. Aguarde 1 minuto e tente novamente.");
        if (res.status === 404) throw new Error("CNPJ não encontrado na Receita Federal.");
        if (!res.ok) throw new Error("Não foi possível consultar o CNPJ agora.");
        return res.json();
      }
      async function invokeScore(body) {
        return supabase.functions.invoke("calculate-score", { body });
      }

      const SEVERITY = {
        critical: { label: "Crítico", dot: "bg-danger", text: "text-danger" },
        high: { label: "Alto", dot: "bg-warning", text: "text-warning" },
        medium: { label: "Médio", dot: "bg-gold", text: "text-gold" },
        low: { label: "Baixo", dot: "bg-slate-400", text: "text-slate-400" },
      };

      const DOC_META = {
        certidao_federal: { label: "CND Federal (PGFN)", required: true, hasExpiry: true },
        certidao_estadual: { label: "Certidão Estadual (SEFAZ)", required: true, hasExpiry: true },
        certidao_municipal: { label: "Certidão Municipal", required: false, hasExpiry: true },
        certidao_trabalhista: { label: "CNDT — Trabalhista", required: true, hasExpiry: true },
        nf_referencia: { label: "Notas Fiscais (últimos 3 meses)", required: true, hasExpiry: false },
        contrato_social: { label: "Contrato Social / Estatuto", required: true, hasExpiry: false },
        alteracao_contratual: { label: "Última Alteração Contratual", required: false, hasExpiry: false },
        outros: { label: "Outros documentos", required: false, hasExpiry: false },
      };
      const docLabel = (tipo) => DOC_META[tipo]?.label || tipo;

      const DIM_META = [
        ["dim_regularidade", "regularidade", "Regularidade Fiscal", "Art. 47, LC 214/2025"],
        ["dim_regime_cnae", "regime_cnae", "Regime × CNAE", "Art. 36, LC 214/2025"],
        ["dim_documentacao", "documentacao", "Documentação Fiscal", null],
        ["dim_consistencia", "consistencia", "Consistência de Emissão", null],
        ["dim_contencioso", "contencioso", "Risco Contencioso", null],
        ["dim_societario", "societario", "Compliance Societário", null],
        ["dim_retencoes", "retencoes", "Retenções Aplicáveis", null],
      ];

      const REGIME_LABEL = { lucro_real: "Lucro Real", lucro_presumido: "Lucro Presumido", simples: "Simples Nacional", mei: "MEI" };

      const mockCompanies = [
        { id:"m1", razao_social:"Metalúrgica Souza Ltda", cnpj:"12.345.678/0001-90", segmento:"Indústria", regime:"lucro_real", estado:"SP", situacao_rfb:"ativa", score: 884, exemplo:true },
        { id:"m2", razao_social:"TechServ B2B Soluções", cnpj:"98.765.432/0001-10", segmento:"Tecnologia", regime:"lucro_presumido", estado:"MG", situacao_rfb:"ativa", score: 742, exemplo:true },
        { id:"m3", razao_social:"LogPrime Transportes", cnpj:"11.222.333/0001-44", segmento:"Logística", regime:"simples", estado:"RJ", situacao_rfb:"ativa", score: 628, exemplo:true },
        { id:"m4", razao_social:"Alfa Obras e Serviços", cnpj:"44.555.666/0001-77", segmento:"Construção", regime:"lucro_presumido", estado:"SP", situacao_rfb:"suspensa", score: 418, exemplo:true },
      ];

      // ---------- Cadastro pendente (resiliente à confirmação de e-mail) ----------
      function readPending() {
        try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); } catch { return null; }
      }
      async function completeSetup(user, pending) {
        const base = {
          id: user.id, full_name: pending.nome, role: "buyer", plan: pending.plano || "free",
          lgpd_consent_version: "1.0", lgpd_consent_at: new Date().toISOString(), monitoring_consent: true,
        };
        let { error: pErr } = await supabase.from("profiles").upsert({ ...base, email: pending.email, display_name: pending.nome, username: String(pending.email).split("@")[0] });
        if (pErr) ({ error: pErr } = await supabase.from("profiles").upsert(base));
        let company = null;
        const { data: existing } = await supabase.from("companies").select("*").eq("cnpj", pending.cnpj).maybeSingle();
        if (existing) {
          company = existing;
        } else {
          const { data, error } = await supabase.from("companies").insert({
            user_id: user.id, cnpj: pending.cnpj, razao_social: pending.razao_social,
            nome_fantasia: pending.nome_fantasia || null, telefone: pending.telefone || null,
            segmento: pending.segmento || null, tipo: "contratante", situacao_rfb: "ativa",
          }).select().single();
          if (error) { toast(translateError(error.message), "error"); return null; }
          company = data;
        }
        await supabase.from("company_users").upsert({ company_id: company.id, user_id: user.id, role: "owner" }, { onConflict: "company_id,user_id" });
        localStorage.removeItem(PENDING_KEY);
        return company;
      }

      function AuthProvider({ children }) {
        const [session, setSession] = useState(null);
        const [user, setUser] = useState(null);
        const [profile, setProfile] = useState(null);
        const [company, setCompany] = useState(null);
        const [loading, setLoading] = useState(true);

        async function refresh(currentSession = session) {
          const u = currentSession?.user;
          setUser(u || null);
          if (!u) { setProfile(null); setCompany(null); setLoading(false); return; }
          const { data: prof } = await supabase.from("profiles").select("*").eq("id", u.id).maybeSingle();
          setProfile(prof || null);
          let comp = null;
          const { data: link } = await supabase.from("company_users").select("company_id").eq("user_id", u.id).limit(1).maybeSingle();
          if (link?.company_id) {
            const { data } = await supabase.from("companies").select("*").eq("id", link.company_id).maybeSingle();
            comp = data;
          }
          if (!comp) {
            const { data } = await supabase.from("companies").select("*").eq("user_id", u.id).order("created_at", { ascending: false }).limit(1).maybeSingle();
            comp = data;
            // Contas antigas podem não ter o vínculo em company_users; sem ele o RLS
            // bloqueia carteira e documentos. Recria o vínculo automaticamente.
            if (comp) await supabase.from("company_users").upsert({ company_id: comp.id, user_id: u.id, role: "owner" }, { onConflict: "company_id,user_id" });
          }
          if (!comp) {
            const pending = readPending();
            if (pending && pending.email === u.email) comp = await completeSetup(u, pending);
          }
          setCompany(comp || null);
          setLoading(false);
        }
        useEffect(() => {
          supabase.auth.getSession().then(({ data }) => { setSession(data.session); refresh(data.session); });
          const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => { setSession(s); refresh(s); });
          return () => sub.subscription.unsubscribe();
        }, []);
        const value = { session, user, profile, company, loading, refresh, signOut: async () => {
          await supabase.auth.signOut();
          toast("Você saiu da sua conta.");
          window.__route.nav("/");
        } };
        return h(AuthContext.Provider, { value }, ...childList(children));
      }
      function useAuth() { return useContext(AuthContext); }
      function useRoute() {
        const [path, setPath] = useState(location.pathname);
        useEffect(() => {
          const onPop = () => setPath(location.pathname);
          addEventListener("popstate", onPop);
          return () => removeEventListener("popstate", onPop);
        }, []);
        const nav = (to) => { history.pushState({}, "", to); setPath(location.pathname); scrollTo(0,0); };
        return { path, nav };
      }

      // ---------- UI primitivos ----------
      function Toasts() {
        const [items, setItems] = useState([]);
        useEffect(() => {
          const onToast = (e) => {
            const id = Date.now() + Math.random();
            setItems((x) => [...x, { id, ...e.detail }]);
            setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), 5000);
          };
          addEventListener("toast", onToast);
          return () => removeEventListener("toast", onToast);
        }, []);
        return h("div", { className:"fixed right-4 top-4 z-[60] space-y-2", role:"status", "aria-live":"polite" }, items.map((i) =>
          h("div", { key:i.id, className:`toast-in flex items-start gap-2 rounded-lg px-4 py-3 shadow-lg text-sm max-w-sm ${i.type === "error" ? "bg-red-600 text-white" : "bg-emerald-700 text-white"}` },
            h("span", { className:"font-bold" }, i.type === "error" ? "✕" : "✓"),
            h("span", { className:"flex-1" }, i.message),
            h("button", { onClick:()=>setItems((x)=>x.filter((t)=>t.id!==i.id)), "aria-label":"Fechar aviso", className:"ml-1 shrink-0 font-bold opacity-60 hover:opacity-100" }, "✕"))
        ));
      }
      function Link({ to, children, className, onClick }) {
        const route = window.__route;
        return h("a", { href:to, className, onClick:(e)=>{ e.preventDefault(); onClick && onClick(); route.nav(to); } }, ...childList(children));
      }
      function Card({ children, className="" }) { return h("div", { className:`card-lift rounded-xl border border-slate-200 bg-white p-5 shadow-sm ${className}` }, ...childList(children)); }
      function Button({ children, onClick, type="button", disabled=false, variant="primary", className="" }) {
        const styles = variant === "ghost" ? "border bg-white text-slate-700 hover:bg-slate-50" : variant === "danger" ? "bg-danger text-white" : "bg-brand text-white hover:bg-blue-700";
        return h("button", { type, disabled, onClick, className:`inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-bold disabled:opacity-50 ${styles} ${className}` }, ...childList(children));
      }
      function Field({ label, children, error, hint }) {
        return h("label", { className:"block" },
          h("span", { className:"mb-1 block text-sm font-semibold text-slate-700" }, label),
          ...childList(children),
          hint && !error && h("span", { className:"mt-1 block text-xs text-slate-500" }, hint),
          error && h("span", { className:"mt-1 block text-xs text-danger" }, error));
      }
      function Input(props) { return h("input", { ...props, className:`w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand ${props.className || ""}` }); }
      function Select(props) { return h("select", { ...props, className:"w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand" }, props.children); }
      function SuccessPanel({ title, message, action }) {
        return h("div", { className:"fade-in rounded-xl border border-gold/40 bg-white p-8 text-center" },
          h("div", { className:"mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-success text-2xl font-black text-white" }, "✓"),
          h("h3", { className:"font-serif text-2xl font-black" }, title),
          h("p", { className:"mt-2 text-sm text-slate-600" }, message),
          action);
      }

      // ---------- Movimento / polimento ----------
      function Reveal({ children, className = "", delay = 0 }) {
        const ref = React.useRef(null);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { el.classList.add("on"); io.disconnect(); }
          }, { threshold: 0.12 });
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return h("div", { ref, className: `reveal ${className}`, style: delay ? { transitionDelay: `${delay}ms` } : undefined }, ...childList(children));
      }
      function CountUp({ value, duration = 900 }) {
        const [n, setN] = useState(0);
        useEffect(() => {
          const target = Number(value) || 0;
          if (!target) { setN(0); return; }
          let raf;
          const t0 = performance.now();
          const tick = (t) => {
            const p = Math.min((t - t0) / duration, 1);
            setN(target * (1 - Math.pow(1 - p, 3)));
            if (p < 1) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        }, [value]);
        return Math.round(n).toLocaleString("pt-BR");
      }
      function SkeletonCard() {
        return h(Card, null,
          h("div", { className: "skel h-5 w-2/3" }),
          h("div", { className: "skel mt-2 h-4 w-1/3" }),
          h("div", { className: "skel mt-5 h-2 w-full" }),
          h("div", { className: "skel mt-4 h-8 w-1/2" }));
      }
      const NAV_ICONS = {

            h("p",{className:"mt-1 text-sm text-slate-500"},"Digite o CNPJ — buscamos os dados na Receita Federal e calculamos o score automaticamente."),
            h("form",{onSubmit:add,className:"mt-4 flex flex-col gap-3 md:flex-row"},
              h(Input,{value:cnpj,onChange:e=>setCnpj(formatCnpj(e.target.value)),placeholder:"00.000.000/0000-00",inputMode:"numeric","aria-label":"CNPJ do fornecedor"}),
              h(Button,{type:"submit",disabled:loading,className:"md:w-44"},loading?"Consultando...":"Adicionar"))),
          h(Card,{className:"mt-6 overflow-x-auto"},
            h("h2",{className:"font-bold"},"Carteira de fornecedores"),
            items.length === 0 && loaded
              ? h("p",{className:"mt-4 text-sm text-slate-500"},"Sua carteira está vazia. Adicione o primeiro fornecedor acima para começar a monitorar a conformidade fiscal.")
              : h("table",{className:"mt-4 w-full text-left text-sm"},
                h("thead",null,h("tr",{className:"border-b"},["Empresa","CNPJ","Segmento","Score","Situação","Ações"].map(x=>h("th",{key:x,className:"py-2 pr-3"},x)))),
                h("tbody",null,items.map(i=>{
                  const rr=risk(i.score);
                  return h("tr",{key:i.portfolio.id,className:"border-b"},
                    h("td",{className:"py-3 pr-3 font-semibold"},i.razao_social),
                    h("td",{className:"pr-3"},formatCnpj(i.cnpj)),
                    h("td",{className:"pr-3"},i.segmento||"—"),
                    h("td",{className:"pr-3"}, i.score!==null ? h("span",{className:`rounded-full px-2 py-1 text-xs font-bold ${rr.soft} ${rr.text}`},Math.round(i.score)) : h("span",{className:"text-xs text-slate-400"},"em análise")),
                    h("td",{className:"pr-3"},h("span",{className:i.situacao_rfb==="ativa"?"text-success":"text-danger"},i.situacao_rfb||"ativa")),
                    h("td",{className:"whitespace-nowrap"},
                      h("button",{onClick:()=>setSelected(i),className:"mr-2 text-xs font-bold text-brand hover:underline"},"Ver análise"),
                      h("button",{onClick:()=>refreshScore(i),className:"mr-2 text-xs text-slate-500 hover:underline"},"Atualizar"),
                      h("button",{onClick:()=>remove(i),className:"text-xs text-danger hover:underline"},"Remover")));
                }))),
            h(ScoreDisclaimer)),
          h(Card,{className:"mt-6"},
            h("h2",{className:"font-bold"},"Alertas recentes"),
            alerts.length
              ? alerts.map(a=>{
                  const sev=SEVERITY[a.severity]||SEVERITY.low;
                  return h("div",{key:a.id,className:"mt-3 flex items-start justify-between gap-3 rounded-lg bg-slate-50 p-3 text-sm"},
                    h("div",{className:"flex items-start gap-2"},
                      h("span",{className:`mt-1.5 h-2 w-2 shrink-0 rounded-full ${sev.dot}`}),
                      h("div",null,
                        h("strong",null,a.title),
                        h("span",{className:`ml-2 text-xs font-bold uppercase ${sev.text}`},sev.label),
                        h("p",{className:"text-slate-600"},a.description),
                        h("p",{className:"mt-1 text-xs text-slate-400"},timeAgo(a.created_at)))),
                    h("button",{onClick:()=>markRead(a),className:"shrink-0 text-xs text-slate-500 hover:underline"},"Marcar lido"));
                })
              : h("p",{className:"mt-2 text-sm text-slate-500"},"Nenhum alerta ativo. O monitoramento diário avisa quando algo mudar.")),
          selected && h(KypModal,{company:selected,onClose:()=>setSelected(null)}));
      }

      // ---------- Documentos ----------
      function Documents() {
        const { company }=useAuth();
        const [docs,setDocs]=useState([]);
        const [file,setFile]=useState(null);
        const [tipo,setTipo]=useState("certidao_federal");
        const [valid,setValid]=useState("");
        const [loading,setLoading]=useState(false);
        const ACCEPTED=[".pdf",".xml",".jpg",".jpeg",".png"];
        const MAX_MB=10;

        async function load(){
          if(!company) return;
          const { data }=await supabase.from("documents").select("*").eq("company_id",company.id).order("created_at",{ascending:false});
          setDocs(data||[]);
        }
        useEffect(()=>{load()},[company?.id]);

        function pickFile(e){
          const f=e.target.files[0];
          if(!f) return setFile(null);
          const ext="."+(f.name.split(".").pop()||"").toLowerCase();
          if(!ACCEPTED.includes(ext)){ e.target.value=""; return toast("Formato não aceito. Use PDF, XML ou imagem (JPG/PNG).","error"); }
          if(f.size>MAX_MB*1024*1024){ e.target.value=""; return toast(`Arquivo muito grande. Limite: ${MAX_MB}MB.`,"error"); }
          setFile(f);
        }
        async function upload(e){
          e.preventDefault();
          if(!file) return toast("Selecione um arquivo.","error");
          if(DOC_META[tipo]?.hasExpiry && !valid) return toast("Informe a data de validade deste documento.","error");
          setLoading(true);
          const path=`${company.id}/${tipo}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
          const up=await supabase.storage.from("documents").upload(path,file,{upsert:true});
          if(up.error){setLoading(false);return toast(translateError(up.error.message),"error");}
          const { error }=await supabase.from("documents").insert({company_id:company.id,tipo,filename:file.name,storage_path:path,tamanho:file.size,valid_until:valid||null,validade:valid||null,status:"valid",lgpd_consent:true,lgpd_consent_at:new Date().toISOString()});
          if(error){ setLoading(false); return toast(translateError(error.message),"error"); }
          invokeScore({company_id:company.id,force:true}).catch(()=>null);
          setLoading(false); setFile(null); setValid("");
          toast("Documento enviado! Seu score está sendo recalculado.");
          load();
        }
        async function download(d){
          const { data, error } = await supabase.storage.from("documents").createSignedUrl(d.storage_path, 3600);
          if(error||!data?.signedUrl) return toast("Não foi possível gerar o link de download.","error");
          open(data.signedUrl,"_blank");
        }
        function docStatus(d){
          if(!d.valid_until) return { label:"Sem validade", cls:"text-slate-500" };
          const days=Math.ceil((Date.parse(d.valid_until)-Date.now())/86400000);
          if(days<0) return { label:`Vencido em ${new Date(d.valid_until).toLocaleDateString("pt-BR")}`, cls:"text-danger font-bold" };
          if(days<=30) return { label:`Vence em ${days} dias`, cls:"text-warning font-bold" };
          return { label:`Válido até ${new Date(d.valid_until).toLocaleDateString("pt-BR")}`, cls:"text-success" };
        }
        const requiredMissing = Object.entries(DOC_META).filter(([k,m])=>m.required && !docs.some(d=>d.tipo===k)).map(([k,m])=>m.label);
        return h(PrivateLayout,null,
          h(Card,null,
            h("h1",{className:"font-serif text-4xl font-black"},"Documentos"),
            h("p",{className:"mt-2 text-sm text-slate-500"},"A documentação enviada compõe a dimensão \"Documentação Fiscal\" do Score Crivo. Formatos aceitos: PDF, XML, JPG, PNG (até 10MB)."),
            company && h("div",{className:`mt-4 rounded-lg border p-3 text-sm ${company.listed?"border-success/40 text-success":"border-slate-200 text-slate-600"}`},
              company.listed
                ? "✓ Sua empresa está publicada no diretório Crivo, visível para contratantes."
                : "Sua empresa ainda não aparece no diretório público. Envie todos os documentos obrigatórios — após análise da equipe Crivo, seu perfil será publicado."),
            requiredMissing.length>0 && h("div",{className:"mt-4 rounded-lg border border-warning/40 bg-amber-50 p-3 text-sm text-slate-700"},
              h("strong",null,"Para elevar o score, envie: "),requiredMissing.join(", ")),
            h("form",{onSubmit:upload,className:"mt-6 grid gap-3 md:grid-cols-[1fr_1fr_1fr_auto] md:items-end"},
              h(Field,{label:"Arquivo"},h("input",{type:"file",accept:ACCEPTED.join(","),onChange:pickFile,className:"w-full rounded-lg border p-2"})),
              h(Field,{label:"Tipo de documento"},h(Select,{value:tipo,onChange:e=>setTipo(e.target.value)},Object.entries(DOC_META).map(([k,m])=>h("option",{key:k,value:k},m.label)))),
              h(Field,{label:"Validade do documento",hint:DOC_META[tipo]?.hasExpiry?"Obrigatória para certidões.":"Opcional para este tipo."},h(Input,{type:"date",value:valid,onChange:e=>setValid(e.target.value)})),
              h(Button,{type:"submit",disabled:loading,className:"md:mb-6"},loading?"Enviando...":"Enviar"))),
          h(Card,{className:"mt-6"},
            h("h2",{className:"font-bold"},"Arquivos enviados"),
            docs.length
              ? docs.map(d=>{
                  const st=docStatus(d);
                  return h("div",{key:d.id,className:"mt-3 flex flex-wrap items-center justify-between gap-2 rounded-lg border p-3 text-sm"},
                    h("div",null,
                      h("p",{className:"font-semibold"},docLabel(d.tipo)),
                      h("p",{className:"text-xs text-slate-500"},d.filename)),
                    h("div",{className:"flex items-center gap-3"},
                      h("span",{className:`text-xs ${st.cls}`},st.label),
                      h("button",{onClick:()=>download(d),className:"text-xs font-bold text-brand hover:underline"},"Baixar")));
                })
              : h("p",{className:"mt-2 text-sm text-slate-500"},"Nenhum documento enviado ainda.")));
      }

      // ---------- Escritório ----------
      function Escritorio() {
        const [f,setF]=useState({nome:"",email:"",crc:"",escritorio:"",qtd:"",telefone:"",canal:""});
        const [loading,setLoading]=useState(false);
        const [sent,setSent]=useState(false);
        const u=(k,v)=>setF(x=>({...x,[k]:v}));
        async function submit(e){
          e.preventDefault();
          if(!/^\S+@\S+\.\S+$/.test(f.email)) return toast("Digite um e-mail válido.","error");
          setLoading(true);
          const {error}=await supabase.from("leads").insert({tipo:"parceiro_contador",source:"parceiro",nome:f.nome,email:f.email,crc:f.crc,escritorio:f.escritorio,qtd_clientes_pj:Number(f.qtd)||0,telefone:f.telefone,canal_aquisicao:f.canal,status:"novo"});
          supabase.functions.invoke("send-email",{body:{tipo:"parceiro-contador-recebido",email:f.email,nome:f.nome,subject:"Recebemos sua solicitação de parceria — Crivo",body:"Recebemos sua solicitação de parceria. Entraremos em contato para seu onboarding como parceiro Crivo."}}).catch(()=>null);
          setLoading(false);
          if(error) return toast(translateError(error.message),"error");
          setSent(true);
        }
        const { session } = useAuth();
        const Layout = session ? PrivateLayout : PublicLayout;
        return h(Layout,null,h("main",{className:"mx-auto grid max-w-7xl gap-8 px-4 py-12 md:grid-cols-[1fr_.9fr]"},
          h("div",null,
            h("h1",{className:"font-serif text-5xl font-black text-navy"},"Dashboard para escritórios"),
            h("p",{className:"mt-4 text-slate-600"},"Gerencie clientes, fornecedores em risco, alertas críticos e comissões recorrentes de 20% sobre cada cliente indicado."),
            h("div",{className:"mt-8 grid gap-4 md:grid-cols-2"},[
              ["Visão multiempresa","Todos os clientes e seus fornecedores em um único painel."],
              ["Alertas priorizados","Mudanças críticas de situação fiscal em destaque."],
              ["Comissões recorrentes","20% do plano de cada cliente indicado, todo mês."],
              ["White-label","Apresente o Crivo com a marca do seu escritório (Premium)."],
            ].map(([t,d])=>h(Card,{key:t},h("strong",null,t),h("p",{className:"mt-2 text-sm text-slate-500"},d))))),
          sent
            ? h(SuccessPanel,{title:"Solicitação enviada!",message:"Entraremos em contato para seu onboarding como parceiro Crivo."})
            : h(Card,null,h("h2",{className:"font-serif text-3xl font-black"},"Quero ser parceiro"),
              h("form",{onSubmit:submit,className:"mt-5 space-y-3"},
                [["nome","Nome do contador"],["email","E-mail"],["crc","CRC"],["escritorio","Escritório"],["qtd","Quantidade de clientes PJ"],["telefone","Telefone"],["canal","Como conheceu o Crivo"]].map(([k,l])=>
                  h(Field,{key:k,label:l},h(Input,{type:k==="email"?"email":k==="qtd"?"number":"text",value:f[k],onChange:e=>u(k,e.target.value),required:k!=="telefone"&&k!=="canal"}))),
                h(Button,{type:"submit",disabled:loading,className:"w-full"},loading?"Enviando...":"Enviar")))));
      }

      // ---------- Páginas legais ----------
      function LegalPage({ title, version, children }) {
        return h(PublicLayout,null,h("main",{className:"mx-auto max-w-3xl px-4 py-12"},
          h("h1",{className:"font-serif text-4xl font-black text-navy"},title),
          h("p",{className:"mt-2 text-xs uppercase tracking-widest text-slate-500"},version),
          h("div",{className:"mt-8 space-y-6 text-sm leading-relaxed text-slate-600"},...childList(children))));
      }
      function LegalSection({ title, children }) {
        return h("section",null,h("h2",{className:"mb-2 font-bold text-navy"},title),...childList(children));
      }
      function Privacidade() {
        return h(LegalPage,{title:"Política de Privacidade",version:"Versão 1.0 · Junho 2026"},
          h(LegalSection,{title:"1. Quem somos"},h("p",null,"O Crivo é um produto Adeke. Encarregado de Dados (DPO): dpo@adeke.com.br.")),
          h(LegalSection,{title:"2. Dados que coletamos"},h("p",null,"Dados cadastrais (nome, e-mail, cargo), dados societários e fiscais públicos de empresas (Receita Federal, PGFN), documentos enviados voluntariamente e registros de uso da plataforma.")),
          h(LegalSection,{title:"3. Finalidade"},h("p",null,"Avaliação de conformidade fiscal de fornecedores, prestação dos serviços contratados e melhoria da plataforma.")),
          h(LegalSection,{title:"4. Bases legais (Art. 7º, LGPD)"},h("p",null,"Execução de contrato, legítimo interesse (dados públicos empresariais), consentimento (documentos enviados) e cumprimento de obrigação legal.")),
          h(LegalSection,{title:"5. Compartilhamento"},h("p",null,"Utilizamos Supabase (infraestrutura), Stripe (pagamentos) e Resend (e-mails) como operadores. Nunca vendemos dados pessoais.")),
          h(LegalSection,{title:"6. Retenção"},h("p",null,"Dados fiscais: 5 anos (obrigação legal — Art. 195, CTN). Dados de conta: até a exclusão da conta + 90 dias. Logs de acesso: 1 ano.")),
          h(LegalSection,{title:"7. Direitos do titular (Art. 18, LGPD)"},h("p",null,"Você pode solicitar acesso, correção, exclusão, portabilidade e revogação de consentimento pelo e-mail dpo@adeke.com.br. Prazo de resposta: 15 dias.")),
          h(LegalSection,{title:"8. Segurança"},h("p",null,"Criptografia em trânsito (TLS) e em repouso, autenticação gerenciada e controle de acesso por linha (RLS) no banco de dados.")),
          h(ScoreDisclaimer));
      }
      function Termos() {
        return h(LegalPage,{title:"Termos de Uso",version:"Versão 1.0 · Junho 2026"},
          h(LegalSection,{title:"1. O serviço"},h("p",null,"O Crivo é um sistema de apoio à decisão que organiza dados públicos e documentos fornecidos para gerar indicadores de aderência tributária de empresas (Score Crivo).")),
          h(LegalSection,{title:"2. Natureza do Score Crivo"},h("p",null,"O Score Crivo é um indicador estatístico. Ele não constitui parecer jurídico ou contábil, não garante aproveitamento de crédito CBS/IBS, não certifica empresas e não substitui a análise de um contador ou advogado tributarista.")),
          h(LegalSection,{title:"3. Responsabilidade"},h("p",null,"As decisões de contratação são de responsabilidade exclusiva do usuário. O Crivo não se responsabiliza por glosas, autuações ou prejuízos decorrentes de decisões tomadas com base nos indicadores apresentados.")),
          h(LegalSection,{title:"4. Fontes de dados"},h("p",null,"Os dados públicos são obtidos de fontes oficiais (Receita Federal, PGFN) e podem apresentar defasagem em relação à situação atual da empresa. A data da última atualização é exibida junto a cada análise.")),
          h(LegalSection,{title:"5. Conta e planos"},h("p",null,"O usuário é responsável pela veracidade dos dados cadastrados e pela guarda de suas credenciais. Assinaturas são cobradas mensalmente e podem ser canceladas a qualquer momento, com efeito no ciclo seguinte.")),
          h(ScoreDisclaimer));
      }
      function NotFound() {
        return h(PublicLayout,null,h("main",{className:"mx-auto max-w-xl px-4 py-24 text-center"},
          h("p",{className:"font-serif text-7xl font-black text-gold"},"404"),
          h("h1",{className:"mt-4 font-serif text-3xl font-black"},"Página não encontrada"),
          h("p",{className:"mt-2 text-slate-500"},"O endereço que você acessou não existe ou foi movido."),
          h(Link,{to:"/",className:"mt-6 inline-flex rounded-lg bg-gold px-5 py-2 font-bold text-navy"},"Voltar ao início")));
      }
      function AuthCallback(){
        useEffect(()=>{ supabase.auth.exchangeCodeForSession(location.href).finally(()=>window.__route.nav("/painel")); },[]);
        return h("div",{className:"p-12 text-center"},"Confirmando login...");
      }

      // ---------- Administração (curadoria do diretório) ----------
      function AdminPage() {
        const { profile } = useAuth();
        const [rows,setRows]=useState([]);
        const [docs,setDocs]=useState({});
        const [loading,setLoading]=useState(true);
        async function load(){
          const { data } = await supabase.from("companies").select("*").order("listed",{ascending:true}).order("created_at",{ascending:false}).limit(200);
          setRows(data||[]);
          const { data: ds } = await supabase.from("documents").select("company_id,status");
          const map={};
          (ds||[]).forEach(d=>{ if(d.status==="valid") map[d.company_id]=(map[d.company_id]||0)+1; });
          setDocs(map);
          setLoading(false);
        }
        useEffect(()=>{ if(profile?.role==="admin") load(); },[profile?.role]);
        async function setListed(c, value){
          const { error } = await supabase.from("companies").update({ listed:value }).eq("id",c.id);
          if(error) return toast(translateError(error.message),"error");
          toast(value?"Empresa publicada no diretório.":"Empresa removida do diretório.");
          load();
        }
        if (profile && profile.role !== "admin") {
          return h(PrivateLayout,null,h(Card,null,h("p",{className:"text-sm text-slate-600"},"Acesso restrito à equipe Crivo.")));
        }
        return h(PrivateLayout,null,
          h(Card,{className:"overflow-x-auto"},
            h("h1",{className:"font-serif text-4xl font-black"},"Administração do diretório"),
            h("p",{className:"mt-2 text-sm text-slate-500"},"Somente empresas publicadas aparecem no diretório para visitantes. Recomendação: publicar após conferir a documentação (coluna Docs)."),
            loading
              ? h("p",{className:"mt-4 text-sm text-slate-500"},"Carregando...")
              : h("table",{className:"mt-6 w-full text-left text-sm"},
                h("thead",null,h("tr",{className:"border-b"},["Empresa","CNPJ","Docs válidos","Situação RFB","Diretório","Ação"].map((x)=>h("th",{key:x,className:"py-2 pr-3"},x)))),
                h("tbody",null,rows.map(c=>h("tr",{key:c.id,className:"border-b"},
                  h("td",{className:"py-3 pr-3 font-semibold"},c.razao_social),
                  h("td",{className:"pr-3"},formatCnpj(c.cnpj)),
                  h("td",{className:"pr-3"},`${docs[c.id]||0}/5`),
                  h("td",{className:"pr-3"},h("span",{className:c.situacao_rfb==="ativa"?"text-success":"text-danger"},c.situacao_rfb||"—")),
                  h("td",{className:"pr-3"}, c.listed
                    ? h("span",{className:"rounded-full bg-green-50 px-2 py-1 text-xs font-bold text-success"},"Publicado")
                    : h("span",{className:"rounded-full bg-slate-100 px-2 py-1 text-xs font-bold text-slate-500"},"Em análise")),
                  h("td",null, c.listed
                    ? h("button",{onClick:()=>setListed(c,false),className:"text-xs font-bold text-danger hover:underline"},"Despublicar")
                    : h("button",{onClick:()=>setListed(c,true),className:"text-xs font-bold text-brand hover:underline"},"Publicar"))))))));
      }

      // ---------- App / rotas ----------
      function App() {
        const route = useRoute(); window.__route = route;
        const path = route.path;
        const publicMap = {
          "/": Home,
          "/diretorio": Directory,
          "/planos": Planos,
          "/cadastrar": Register,
          "/login": Login,
          "/escritorio": Escritorio,
          "/privacidade": Privacidade,
          "/termos": Termos,
          "/auth/callback": AuthCallback,
        };
        const privateMap = { "/painel":Painel, "/dashboard":Dashboard, "/documentos":Documents, "/admin":AdminPage };
        if (privateMap[path]) return h(AuthProvider,null,h(Toasts),h(Protected,null,h("div",{key:path,className:"page-enter"},h(privateMap[path]))));
        const Page = publicMap[path] || NotFound;
        return h(AuthProvider,null,h(Toasts),h("div",{key:path,className:"page-enter"},h(Page)));
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
