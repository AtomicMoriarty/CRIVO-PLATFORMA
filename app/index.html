      // ---------- Helpers ----------
      function cleanCnpj(v) { return String(v || "").replace(/\D/g, ""); }
      function formatCnpj(v) {
        const d = cleanCnpj(v).slice(0, 14);
        return d.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
      }
      function validCnpj(value) {
        const c = cleanCnpj(value);
        if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
        const calc = (base, weights) => {
          const n = base.split("").reduce((a, v, i) => a + Number(v) * weights[i], 0);
          const x = n % 11;
          return x < 2 ? 0 : 11 - x;
        };
        const d1 = calc(c.slice(0, 12), [5,4,3,2,9,8,7,6,5,4,3,2]);
        const d2 = calc(c.slice(0, 12) + d1, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
        return d1 === Number(c[12]) && d2 === Number(c[13]);
      }
      function risk(score) {
        const n = Number(score || 0);
        if (n >= 800) return { label: "Baixo risco", color: "bg-success", fill: "fill-g", text: "text-success", soft: "bg-green-50" };
        if (n >= 600) return { label: "Médio risco", color: "bg-warning", fill: "fill-a", text: "text-warning", soft: "bg-amber-50" };
        return { label: "Alto risco", color: "bg-danger", fill: "fill-r", text: "text-danger", soft: "bg-red-50" };
      }
      // Saúde Financeira (Painel Receita): score a partir dos percentis (0–100) vs. setor.
      // Endividamento tem polaridade negativa (menos dívida = melhor) → invertido.
      function calcFinancial(p) {
        const clamp = (v) => Math.max(0, Math.min(100, Number(v) || 0));
        const r = clamp(p.rentabilidade), l = clamp(p.liquidez), e = clamp(p.endividamento);
        const dim_rentabilidade = Math.round(r * 10);
        const dim_liquidez = Math.round(l * 10);
        const dim_endividamento = Math.round((100 - e) * 10);
        const total = Math.round(dim_rentabilidade * 0.35 + dim_liquidez * 0.35 + dim_endividamento * 0.30);
        return { total, dim_rentabilidade, dim_liquidez, dim_endividamento, percentis: { rentabilidade: r, liquidez: l, endividamento: e } };
      }
      function finRisk(total) {
        const n = Number(total || 0);
        return { ...risk(total), label: n >= 800 ? "Forte" : n >= 600 ? "Moderada" : "Frágil" };

      const REGULAR_RATE = 0.28;

      const creditRate = (regime) => CREDIT_RATE[regime] ?? REGULAR_RATE;
      function translateError(message) {

        return m || "Algo deu errado. Tente novamente.";

      async function lookupCnpj(cnpj) {
        const d = cleanCnpj(cnpj);
        if (d.length !== 14) throw new Error("CNPJ incompleto");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        let res;
        try {
          res = await fetch(`https://publica.cnpj.ws/cnpj/${d}`, { signal: controller.signal });
        } catch (e) {
          if (e?.name === "AbortError") throw new Error("A consulta à Receita demorou demais. Tente novamente.");
          throw new Error("Não foi possível consultar o CNPJ agora.");
        } finally {
          clearTimeout(timeout);
        }
        if (res.status === 429) throw new Error("Limite de consultas à Receita atingido. Aguarde 1 minuto e tente novamente.");
        if (res.status === 404) throw new Error("CNPJ não encontrado na Receita Federal.");
        if (!res.ok) throw new Error("Não foi possível consultar o CNPJ agora.");

        const W = 320, H = 56, pad = 5;

      // ---------- Painel do Contador — Visão Geral (resumo) ----------
      function AccountantHome() {
        const { user } = useAuth();
        const [s, setS] = useState(null);
        useEffect(() => {
          if (!user) return;
          (async () => {
            const { data: links } = await supabase.from("company_users").select("company_id").eq("user_id", user.id).eq("role", "accountant");
            const ids = (links || []).map((l) => l.company_id);
            if (!ids.length) { setS({ clients:0, withFin:0, highRisk:0 }); return; }
            const { data: comps } = await supabase.from("companies").select("id, scores(total,calculated_at), financial_scores(total,created_at)").in("id", ids);
            const latest = (arr, k) => Array.isArray(arr) && arr.length ? [...arr].sort((a,b)=>Date.parse(b[k])-Date.parse(a[k]))[0] : null;
            let withFin = 0, highRisk = 0;
            (comps || []).forEach((c) => {
              if (latest(c.financial_scores, "created_at")) withFin++;
              const conf = latest(c.scores, "calculated_at")?.total;

      // ---------- Documentos ----------
      function Documents() {
        const { company, profile }=useAuth();
        const [docs,setDocs]=useState([]);
        const [file,setFile]=useState(null);
        const [tipo,setTipo]=useState("certidao_federal");
        const [valid,setValid]=useState("");
        const [loading,setLoading]=useState(false);
        const ACCEPTED=[".pdf",".xml",".jpg",".jpeg",".png"];
        const ACCEPTED_MIME=["application/pdf","text/xml","application/xml","image/jpeg","image/png"];
        const MAX_MB=10;

        async function load(){
          if(!company) return;
          const { data }=await supabase.from("documents").select("*").eq("company_id",company.id).order("created_at",{ascending:false});
          setDocs(data||[]);
        }
        useEffect(()=>{load()},[company?.id]);
        useEffect(()=>{
          const m=DOC_META[tipo];
          if(m?.hasExpiry&&m.dias) setValid(new Date(Date.now()+m.dias*86400000).toISOString().slice(0,10));
          else if(!m?.hasExpiry) setValid("");
        },[tipo]);

        function pickFile(e){
          const f=e.target.files[0];
          if(!f) return setFile(null);
          const ext="."+(f.name.split(".").pop()||"").toLowerCase();
          if(!ACCEPTED.includes(ext)){ e.target.value=""; return toast("Formato não aceito. Use PDF, XML ou imagem (JPG/PNG).","error"); }
          if(f.type && !ACCEPTED_MIME.includes(f.type)){ e.target.value=""; return toast("Tipo de arquivo não corresponde ao formato esperado.","error"); }
          if(f.size>MAX_MB*1024*1024){ e.target.value=""; return toast(`Arquivo muito grande. Limite: ${MAX_MB}MB.`,"error"); }
          setFile(f);
        }
        async function upload(e){
          e.preventDefault();
          if(!file) return toast("Selecione um arquivo.","error");
          if(DOC_META[tipo]?.hasExpiry && !valid) return toast("Informe a data de validade deste documento.","error");
          setLoading(true);
          const path=`${company.id}/${tipo}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
          const up=await supabase.storage.from("documents").upload(path,file,{upsert:true});
          if(up.error){setLoading(false);return toast(translateError(up.error.message),"error");}
          // Documento entra como "pending": só passa a contar no score após a
          // aprovação da equipe no /admin (antes nascia "valid" e inflava a
          // dimensão Documentação sem revisão).
          const { error }=await supabase.from("documents").insert({company_id:company.id,tipo,filename:file.name,storage_path:path,tamanho:file.size,valid_until:valid||null,validade:valid||null,status:"pending",lgpd_consent:true,lgpd_consent_at:new Date().toISOString()});
          if(error){ setLoading(false); return toast(translateError(error.message),"error"); }
          setLoading(false); setFile(null); setValid("");
          toast("Documento enviado para análise. Ele passa a contar no score após a aprovação da equipe Crivo.");
          load();
        }
        async function download(d){
          const { data, error } = await supabase.storage.from("documents").createSignedUrl(d.storage_path, 3600);
          if(error||!data?.signedUrl) return toast("Não foi possível gerar o link de download.","error");
          open(data.signedUrl,"_blank");
        }
        function docStatus(d){
          if(!d.valid_until) return { label:"Sem validade", cls:"text-slate-500" };
          const days=Math.ceil((Date.parse(d.valid_until)-Date.now())/86400000);
          if(days<0) return { label:`Vencido em ${new Date(d.valid_until).toLocaleDateString("pt-BR")}`, cls:"text-danger font-bold" };
          if(days<=30) return { label:`Vence em ${days} dias`, cls:"text-warning font-bold" };
