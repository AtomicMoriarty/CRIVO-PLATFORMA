    <style>

        --card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);

      *{letter-spacing:0}
      body { background:var(--ink); color:var(--cream); font-family:"IBM Plex Sans",sans-serif; }

      .border,.border-slate-200,.border-slate-300{border-color:var(--bd2)!important}
      .shadow-sm,.shadow-lg{box-shadow:none!important}
      .rounded-xl{border-radius:10px}
      input,select,textarea{background:rgba(255,255,255,.05)!important;color:var(--cream)!important;border-color:var(--bd2)!important}
      input::placeholder,textarea::placeholder{color:var(--muted)!important}
      option{background:var(--ink2);color:var(--cream)}
      .bg-brand,.bg-gold{background:var(--gold)!important;color:var(--ink)!important}
      .hover\:bg-blue-700:hover,.hover\:bg-yellow-500:hover{background:var(--gold2)!important;color:var(--ink)!important}
      .ring-brand\/20{--tw-ring-color:rgba(200,150,58,.25)!important}

      .font-serif{letter-spacing:-.02em}
      header{border-color:var(--bd)!important}
      a:hover{color:var(--gold2)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { createContext, useContext, useEffect, useMemo, useState } from "https://esm.sh/react@18.2.0";
      import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

      const SUPABASE_URL = "https://lgbuywbcpnghqaoaqsxb.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYnV5d2JjcG5naHFhb2Fxc3hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDM1OTQsImV4cCI6MjA5NjUxOTU5NH0.o4ksmO3u75axuX8-9ena7OC_CgkCC_y9AzPBA60776Q";
      const STRIPE_PUBLISHABLE_KEY = "";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

      const h = React.createElement;
      const childList = (children) => Array.isArray(children) ? children : [children].filter((x) => x !== undefined && x !== null && x !== false);
      const AuthContext = createContext(null);
      const money = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

      const mockCompanies = [
        { id:"m1", razao_social:"Metalúrgica Souza Ltda", cnpj:"12.345.678/0001-90", segmento:"Indústria", regime:"lucro_real", estado:"SP", situacao_rfb:"ativa", score: 884 },
        { id:"m2", razao_social:"TechServ B2B Soluções", cnpj:"98.765.432/0001-10", segmento:"Tecnologia", regime:"lucro_presumido", estado:"MG", situacao_rfb:"ativa", score: 742 },
        { id:"m3", razao_social:"LogPrime Transportes", cnpj:"11.222.333/0001-44", segmento:"Logística", regime:"simples", estado:"RJ", situacao_rfb:"ativa", score: 628 },
        { id:"m4", razao_social:"Alfa Obras e Serviços", cnpj:"44.555.666/0001-77", segmento:"Construção", regime:"lucro_presumido", estado:"SP", situacao_rfb:"suspensa", score: 418 },
      ];

      function cleanCnpj(v) { return String(v || "").replace(/\D/g, ""); }
      function formatCnpj(v) {
        const d = cleanCnpj(v).slice(0, 14);
        return d.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
      }
      function validCnpj(value) {
        const c = cleanCnpj(value);
        if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
        const calc = (base, weights) => {
          const n = base.split("").reduce((a, v, i) => a + Number(v) * weights[i], 0);
          const r = 11 - (n % 11);
          return r < 2 ? 0 : r;
        };
        const d1 = calc(c.slice(0, 12), [5,4,3,2,9,8,7,6,5,4,3,2]);
        const d2 = calc(c.slice(0, 12) + d1, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
        return d1 === Number(c[12]) && d2 === Number(c[13]);
      }
      function risk(score) {
        const n = Number(score || 0);
        if (n >= 800 || n >= 70 && n <= 100) return { label: "Baixo risco", color: "bg-success", text: "text-success", soft: "bg-green-50" };
        if (n >= 600 || n >= 40 && n <= 69) return { label: "Médio risco", color: "bg-warning", text: "text-warning", soft: "bg-amber-50" };
        return { label: "Alto risco", color: "bg-danger", text: "text-danger", soft: "bg-red-50" };
      }
      function toast(message, type = "ok") {
        window.dispatchEvent(new CustomEvent("toast", { detail: { message, type } }));
      }
      async function lookupCnpj(cnpj) {
        const d = cleanCnpj(cnpj);
        if (d.length !== 14) throw new Error("CNPJ incompleto");
        const res = await fetch(`https://publica.cnpj.ws/cnpj/${d}`);
        if (!res.ok) throw new Error("Não foi possível consultar o CNPJ agora");
        return res.json();
      }
      async function invokeScore(body) {
        return supabase.functions.invoke("calculate-score", { body });
      }

      function AuthProvider({ children }) {
        const [session, setSession] = useState(null);
        const [user, setUser] = useState(null);
        const [profile, setProfile] = useState(null);
        const [company, setCompany] = useState(null);
        const [loading, setLoading] = useState(true);

        async function refresh(currentSession = session) {
          const u = currentSession?.user;
          setUser(u || null);
          if (!u) { setProfile(null); setCompany(null); setLoading(false); return; }
          const { data: prof } = await supabase.from("profiles").select("*").eq("id", u.id).maybeSingle();
          setProfile(prof || null);
          const { data: link } = await supabase.from("company_users").select("company_id").eq("user_id", u.id).limit(1).maybeSingle();
          if (link?.company_id) {
            const { data: comp } = await supabase.from("companies").select("*").eq("id", link.company_id).maybeSingle();
            setCompany(comp || null);
          } else {
            const { data: comp } = await supabase.from("companies").select("*").eq("user_id", u.id).order("created_at", { ascending:false }).limit(1).maybeSingle();
            setCompany(comp || null);
          }
          setLoading(false);
        }
        useEffect(() => {
          supabase.auth.getSession().then(({ data }) => { setSession(data.session); refresh(data.session); });
          const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => { setSession(s); refresh(s); });
          return () => sub.subscription.unsubscribe();
        }, []);
        const value = { session, user, profile, company, loading, refresh, signOut: () => supabase.auth.signOut() };
        return h(AuthContext.Provider, { value }, ...childList(children));
      }
      function useAuth() { return useContext(AuthContext); }
      function useRoute() {
        const [path, setPath] = useState(location.pathname);
        useEffect(() => {
          const onPop = () => setPath(location.pathname);
          addEventListener("popstate", onPop);
          return () => removeEventListener("popstate", onPop);
        }, []);
        const nav = (to) => { history.pushState({}, "", to); setPath(location.pathname); scrollTo(0,0); };
        return { path, nav };
      }

      function Toasts() {
        const [items, setItems] = useState([]);
        useEffect(() => {
          const onToast = (e) => {
            const id = Date.now();
            setItems((x) => [...x, { id, ...e.detail }]);
            setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), 4200);
          };
          addEventListener("toast", onToast);
          return () => removeEventListener("toast", onToast);
        }, []);
        return h("div", { className:"fixed right-4 top-4 z-50 space-y-2" }, items.map((i) =>
          h("div", { key:i.id, className:`rounded-lg px-4 py-3 shadow-lg text-sm ${i.type === "error" ? "bg-red-600 text-white" : "bg-slate-900 text-white"}` }, i.message)
        ));
      }
      function Link({ to, children, className }) {
        const route = window.__route;
        return h("a", { href:to, className, onClick:(e)=>{ e.preventDefault(); route.nav(to); } }, ...childList(children));
      }
      function PublicLayout({ children }) {
        const { session, signOut } = useAuth();
        return h("div", null,
          h("header", { className:"sticky top-0 z-40 border-b border-slate-200 glass" },
            h("div", { className:"mx-auto flex h-16 max-w-7xl items-center justify-between px-4" },
              h(Link, { to:"/", className:"flex items-center gap-2 font-serif text-2xl font-black text-navy" }, "Crivo", h("span", { className:"text-gold" }, "."), h("span", { className:"rounded border border-gold/40 px-2 py-0.5 font-sans text-[10px] uppercase tracking-widest text-gold" }, "by Adeke")),
              h("nav", { className:"hidden items-center gap-6 text-sm font-medium md:flex" },
                h(Link, { to:"/diretorio", className:"hover:text-brand" }, "Diretório"),
                h(Link, { to:"/planos", className:"hover:text-brand" }, "Planos"),
                session ? h(Link, { to:"/painel", className:"hover:text-brand" }, "Painel") : h(Link, { to:"/login", className:"hover:text-brand" }, "Entrar"),
                session && h("button", { onClick:signOut, className:"text-slate-500 hover:text-danger" }, "Sair"),
                h(Link, { to:"/cadastrar", className:"rounded-lg bg-gold px-4 py-2 font-bold text-navy hover:bg-yellow-500" }, "Começar grátis")
              )
            )
          ),
          ...childList(children),
          h(Footer)
        );
      }
      function PrivateLayout({ children }) {
        const { user, company, signOut } = useAuth();
        const links = [["/painel","Painel"],["/dashboard","Dashboard"],["/documentos","Documentos"],["/escritorio","Escritório"],["/planos","Planos"]];
        return h("div", { className:"min-h-screen bg-slate-100 md:flex" },
          h("aside", { className:"border-r bg-navy p-4 text-white md:min-h-screen md:w-64" },
            h(Link, { to:"/", className:"mb-8 flex items-center gap-2 font-serif text-2xl font-black" }, "Crivo", h("span", { className:"text-gold" }, ".")),
            h("nav", { className:"grid gap-2" }, links.map(([to,label]) => h(Link, { key:to, to, className:"rounded-lg px-3 py-2 text-sm hover:bg-white/10" }, label)))
          ),
          h("main", { className:"flex-1" },
            h("div", { className:"flex items-center justify-between border-b bg-white px-5 py-4" },
              h("div", null, h("p", { className:"text-xs uppercase tracking-widest text-slate-500" }, "Conta"), h("p", { className:"font-semibold" }, company?.razao_social || user?.email || "Crivo")),
              h("button", { onClick:signOut, className:"inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-sm hover:bg-slate-50" }, "Sair")
            ),
            h("div", { className:"p-5" }, ...childList(children))
          )
        );
      }
      function Protected({ children }) {
        const { session, loading } = useAuth();
        const route = window.__route;
        useEffect(() => { if (!loading && !session) route.nav("/cadastrar"); }, [loading, session]);
        if (loading) return h("div", { className:"p-12 text-center text-slate-500" }, "Carregando...");
        if (!session) return null;
        return h(React.Fragment, null, ...childList(children));
      }
      function Footer() {
        return h("footer", { className:"border-t bg-navy text-white" },
          h("div", { className:"mx-auto grid max-w-7xl gap-6 px-4 py-10 md:grid-cols-4" },
            h("div", null, h("h3", { className:"font-serif text-2xl font-black" }, "Crivo."), h("p", { className:"mt-2 text-sm text-slate-300" }, "KYP e compliance fiscal de fornecedores.")),
            h("div", null, h("p", { className:"font-semibold" }, "Produto"), h(Link, { to:"/diretorio", className:"mt-2 block text-sm text-slate-300" }, "Diretório"), h(Link, { to:"/planos", className:"mt-2 block text-sm text-slate-300" }, "Planos")),
            h("div", null, h("p", { className:"font-semibold" }, "Legal"), h("p", { className:"mt-2 text-sm text-slate-300" }, "Termos de Uso"), h("p", { className:"mt-2 text-sm text-slate-300" }, "Privacidade")),
            h("div", null, h("p", { className:"font-semibold" }, "Contato"), h("p", { className:"mt-2 text-sm text-slate-300" }, "contato@adeke.com.br"), h("p", { className:"mt-2 text-xs text-slate-400" }, "CNPJ placeholder"))
          )
        );
      }
      function Card({ children, className="" }) { return h("div", { className:`rounded-xl border border-slate-200 bg-white p-5 shadow-sm ${className}` }, ...childList(children)); }
      function Button({ children, onClick, type="button", disabled=false, variant="primary", className="" }) {
        const styles = variant === "ghost" ? "border bg-white text-slate-700 hover:bg-slate-50" : variant === "danger" ? "bg-danger text-white" : "bg-brand text-white hover:bg-blue-700";
        return h("button", { type, disabled, onClick, className:`inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-bold disabled:opacity-50 ${styles} ${className}` }, ...childList(children));
      }
      function Field({ label, children, error }) { return h("label", { className:"block" }, h("span", { className:"mb-1 block text-sm font-semibold text-slate-700" }, label), ...childList(children), error && h("span", { className:"mt-1 block text-xs text-danger" }, error)); }
      function Input(props) { return h("input", { ...props, className:`w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand ${props.className || ""}` }); }
      function Select(props) { return h("select", { ...props, className:"w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand" }, props.children); }

      function Home() {
        const [cnpj,setCnpj] = useState("");
        const [loading,setLoading] = useState(false);
        async function diagnose(e) {
          e.preventDefault();
          if (!validCnpj(cnpj)) return toast("Digite um CNPJ válido.", "error");
          setLoading(true);
          await supabase.from("leads").insert({ tipo:"diagnostico", cnpj:cleanCnpj(cnpj), origem:"landing_hero", source:"diagnostico", status:"novo" });
          await invokeScore({ cnpj:cleanCnpj(cnpj), modo:"preview" }).catch(()=>null);
          setLoading(false);
          window.__route.nav(`/diretorio?cnpj=${cleanCnpj(cnpj)}`);
        }
        return h(PublicLayout, null,
          h("section", { className:"bg-navy text-white" },
            h("div", { className:"mx-auto grid max-w-7xl gap-10 px-4 py-20 md:grid-cols-[1.1fr_.9fr] md:items-center" },
              h("div", null,
                h("div", { className:"mb-5 inline-flex rounded-full border border-gold/40 px-3 py-1 text-xs font-bold uppercase tracking-widest text-gold" }, "ReceitaWS · PGFN · Score diário"),
                h("h1", { className:"font-serif text-5xl font-black leading-tight md:text-7xl" }, "Monitore fornecedores. Evite riscos. Proteja sua empresa."),
                h("p", { className:"mt-6 max-w-2xl text-lg text-slate-300" }, "Crivo analisa CNPJ, situação fiscal e certidões automaticamente, gerando um score de risco atualizado para cada fornecedor da sua carteira."),
                h("form", { onSubmit:diagnose, className:"mt-8 flex max-w-xl flex-col gap-3 rounded-2xl bg-white p-2 md:flex-row" },
                  h(Input, { value:cnpj, onChange:e=>setCnpj(formatCnpj(e.target.value)), placeholder:"00.000.000/0000-00", className:"border-0 text-slate-900" }),
                  h(Button, { type:"submit", disabled:loading, className:"bg-gold text-navy hover:bg-yellow-500" }, loading ? "Analisando..." : "Diagnosticar agora")
                ),
                h("div", { className:"mt-5 flex flex-wrap gap-2 text-xs" }, ["ReceitaWS integrado","Score em tempo real","Alertas automáticos"].map(x=>h("span",{key:x,className:"rounded-full bg-white/10 px-3 py-1"},x)))
              ),
              h(Card, { className:"bg-white/10 text-white border-white/10" },
                h("p", { className:"text-sm text-slate-300" }, "Resumo da carteira"),
                h("div", { className:"mt-4 grid gap-3" }, [["Fornecedores monitorados","128"],["Alertas críticos","7"],["Score médio","812"]].map(([a,b])=>h("div",{key:a,className:"flex items-center justify-between rounded-lg bg-white/10 p-4"},h("span",null,a),h("strong",{className:"text-2xl text-gold"},b))))
              )
            )
          ),
          h(HowItWorks), h(PlansSection), h(AccountantLead)
        );
      }
      function HowItWorks() {
        return h("section", { className:"mx-auto max-w-7xl px-4 py-16" },
          h("h2", { className:"font-serif text-4xl font-black text-navy" }, "Como funciona"),
          h("div", { className:"mt-8 grid gap-5 md:grid-cols-3" }, [
            ["1", "Cadastre os CNPJs", "Monte sua carteira de fornecedores críticos."],
            ["2", "O Crivo consulta bases públicas", "Receita, certidões e sinais de risco fiscal."],
            ["3", "Receba alertas", "Mudanças relevantes viram alertas acionáveis."]
          ].map(([n,t,d])=>h(Card,{key:n},h("div",{className:"mb-4 flex h-10 w-10 items-center justify-center rounded-full bg-brand font-bold text-white"},n),h("h3",{className:"font-bold"},t),h("p",{className:"mt-2 text-sm text-slate-600"},d))))
        );
      }
      function PlansSection() {
        const { session, user, company } = useAuth();
        const plans = [
          ["free","Grátis",0,["3 fornecedores","Score parcial","Diretório público"]],
          ["pro","Pro",297,["50 fornecedores","Alertas automáticos","Documentos e KYP completo"]],
          ["premium","Premium",897,["Ilimitado","Relatórios exportáveis","Escritório e white-label"]]
        ];
        async function checkout(id) {
          if (id === "free" || !session) return window.__route.nav(`/cadastrar?plano=${id}`);
          const { data, error } = await supabase.functions.invoke("create-checkout", {
            body: {
              plano: id,
              email: user?.email,
              empresa_id: company?.id,
              user_id: user?.id,
              success_url: `${location.origin}/painel?checkout=success`,
              cancel_url: `${location.origin}/planos?checkout=cancelled`,
            },
          });
          if (error || !data?.url) return toast("Stripe ainda não está configurado. Envie as chaves para ativar pagamentos.", "error");
          location.href = data.url;
        }
        return h("section", { className:"bg-white" }, h("div", { className:"mx-auto max-w-7xl px-4 py-16" },
          h("h2", { className:"font-serif text-4xl font-black text-navy" }, "Planos"),
          h("div", { className:"mt-8 grid gap-5 md:grid-cols-3" }, plans.map(([id,name,price,items])=>h(Card,{key:id,className:id==="pro"?"border-brand ring-2 ring-brand/20":""},
            h("h3",{className:"text-xl font-black"},name), h("p",{className:"mt-2 text-3xl font-black"}, price ? money.format(price) : "R$ 0", h("span",{className:"text-sm font-medium text-slate-500"},"/mês")),
            h("ul",{className:"mt-5 space-y-2"},items.map(i=>h("li",{key:i,className:"flex items-center gap-2 text-sm"},h("span",{className:"font-bold text-success"},"✓"),i))),
            h("button",{onClick:()=>checkout(id),className:"mt-6 inline-flex w-full justify-center rounded-lg bg-brand px-4 py-2 font-bold text-white"}, price ? `Assinar ${name}` : "Começar grátis")
          )))
        ));
      }
      function AccountantLead() {
        return h("section", { className:"mx-auto max-w-7xl px-4 py-16" },
          h(Card, { className:"grid gap-6 bg-navy text-white md:grid-cols-[1fr_auto] md:items-center" },
            h("div", null, h("h2",{className:"font-serif text-3xl font-black"},"Para escritórios de contabilidade"), h("p",{className:"mt-2 text-slate-300"},"Gerencie clientes, acompanhe alertas e crie uma nova receita recorrente com compliance fiscal.")),
            h(Link,{to:"/escritorio",className:"rounded-lg bg-gold px-5 py-3 font-bold text-navy"},"Quero ser parceiro")
          )
        );
      }

      function Directory() {
        const { session, company } = useAuth();
        const [term,setTerm] = useState(new URLSearchParams(location.search).get("cnpj") || "");
        const [results,setResults] = useState(mockCompanies);
        const [loading,setLoading] = useState(false);
        async function search(e) {
          e?.preventDefault();
          setLoading(true);
          const q = term.trim();
          let rows = [];
          if (cleanCnpj(q).length === 14) {
            const { data } = await supabase.from("companies").select("*, scores(*)").eq("cnpj", cleanCnpj(q)).limit(1);
            rows = data || [];
            if (!rows.length) {
              const r = await lookupCnpj(q).catch(()=>null);
              if (r) rows = [{ id:"preview", cnpj:cleanCnpj(q), razao_social:r.razao_social || r.estabelecimento?.nome_fantasia || "Empresa consultada", segmento:r.atividade_principal?.descricao || "Não informado", estado:r.estabelecimento?.estado?.sigla, situacao_rfb:"ativa", score: null, preview:true }];

      createRoot(document.getElementById("root")).render(h(App));
    </script>
